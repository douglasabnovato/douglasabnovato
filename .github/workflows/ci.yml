name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir README e documentos
        run: |
          node -e '
          const fs = require("fs");
          const s = fs.readFileSync("README.md", "utf8");
          const n = (r) => (s.match(r) || []).length;
          if (n(/<div\b/g) !== n(/<\/div>/g)) throw new Error("div desbalanceada");
          if (n(/<table>/g) !== n(/<\/table>/g)) throw new Error("tabela desbalanceada");
          for (const m of s.matchAll(/<img(?![^>]*alt=)[^>]*>/g)) throw new Error("imagem sem alt: " + m[0]);
          for (const f of ["docs/contribuicao-externa.md", "docs/organizacoes.md"]) fs.accessSync(f);
          '
