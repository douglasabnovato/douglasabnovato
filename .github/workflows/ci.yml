# CI do perfil: confere o README (estrutura, texto alternativo, portfólio a 1 clique e documentos)
# e lista o status dos links externos. Roda nos PRs e pushes para a master e developer/**.
name: CI

on:
  push:
    branches: [master, "developer/**"]
  pull_request:
    branches: [master, "developer/**"]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do verificador
        run: node --test scripts/*.test.mjs
      - name: Conferir README, documentos e links
        run: node scripts/verificar-readme.mjs --rede
