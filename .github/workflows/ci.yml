# CI do perfil: confere o README (estrutura, texto alternativo, portfólio a 1 clique e documentos)
# e lista o status dos links externos. O Playwright abre o README renderizado e clica até o portfólio. Roda nos PRs e pushes para a master e developer/**.
name: CI

on:
  push:
    branches: [master, "developer/**"]
  pull_request:
    branches: [master, "developer/**"]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Testes do verificador
        run: node --test scripts/*.test.mjs
      - name: Conferir README, documentos e links
        run: node scripts/verificar-readme.mjs --rede
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fluxo de ponta a ponta (perfil renderizado pelo GitHub até o portfólio)
        run: npm run test:e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
